name: refresh-data
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: sync e18e module-replacements
        run: node scripts/sync-e18e.mjs
      - name: re-verify curated entries against the registries
        run: node scripts/validate-data.mjs --live --report data-report.md
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: refresh-data
          title: 'data: weekly refresh'
          body-path: data-report.md
          add-paths: data/
          commit-message: 'data: weekly refresh of e18e mappings and entry verification'
