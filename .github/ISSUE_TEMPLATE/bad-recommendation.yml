name: Bad recommendation
description: package-guidance blocked, flagged or recommended something it shouldn't have (or missed something it should have caught).
labels: [recommendation]
body:
  - type: input
    id: command
    attributes:
      label: Command or install
      description: What did you or the agent run?
      placeholder: npx package-guidance check tailwindcss@3 --json
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What package-guidance said
      description: Paste the output (or the hook's deny message).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have said, and why
      description: Link a primary source (changelog, advisory, maintainer announcement) if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: package-guidance version
      placeholder: "0.1.0"
